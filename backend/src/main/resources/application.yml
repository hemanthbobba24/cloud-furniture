server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/furniture?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:password@localhost:27017/furniture?authSource=admin}

# Custom app settings
app:
  jwt:
    secret: ${JWT_SECRET:2f585bc1a2f3462bb4d3b3a3f2f9a9dd3f7a7f2c6f4e9a4c3b8f2e7a6d9c1b2a}
    expirySeconds: ${JWT_EXPIRY:86400}

# Allow bean definition overriding (fixes CORS conflict)
  main:
    allow-bean-definition-overriding: true
